name: turkmax
description: "TurkMax — Yamaha XMAX TFT için navigasyon ve multimedya cockpit uygulaması."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  google_navigation_flutter: ^0.12.0
  permission_handler: ^12.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true
  generate: true

